# Watches the live site every 15 minutes and fails (GitHub emails the owner) when something looks
# wrong: site down or slow, an unexpected deploy, or the demo close to its daily limits.
# Read-only: it only calls the public /api/v1/health endpoint. Run it by hand from the Actions tab.
#
# Status email on every run (optional): add these repository secrets (Settings → Secrets and
# variables → Actions): MAIL_USERNAME and MAIL_PASSWORD (an app password for the sending mailbox),
# MAIL_TO (where to send), and optionally MAIL_SERVER (default smtp.gmail.com) and MAIL_PORT
# (default 465). Without them the check still runs and GitHub emails only on failures.
name: Monitor live site

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: https://lumina.dronovation.com.au/api/v1/health
      EXPECTED_SHA: 6bb497e      # the judged build; an unexpected deploy is flagged
      QUOTA_WARN: '0.7'          # warn at 70% of any daily demo limit
      VISITORS_WARN: '60'        # warn when this many different visitors used the demo today
      SLOW_MS: '5000'
      HAS_MAIL: ${{ secrets.MAIL_USERNAME != '' && 'yes' || 'no' }}
    steps:
      - name: Check health
        id: check
        run: |
          node - <<'JS'
          const { URL, EXPECTED_SHA, QUOTA_WARN, VISITORS_WARN, SLOW_MS } = process.env;
          const problems = [];
          let h = null, ms = 0;
          for (let attempt = 1; attempt <= 3 && !h; attempt++) {
            const t = Date.now();
            try {
              const r = await fetch(URL, { signal: AbortSignal.timeout(20000) });
              ms = Date.now() - t;
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              h = await r.json();
            } catch (e) {
              if (attempt === 3) problems.push(`Site not responding: ${e.message} (3 attempts)`);
              else await new Promise((s) => setTimeout(s, 15000));
            }
          }
          const lines = [];
          if (h) {
            if (h.status !== 'ok') problems.push(`Health status is "${h.status}"`);
            if (ms > Number(SLOW_MS)) problems.push(`Slow response: ${ms} ms`);
            const sha = h.build?.sha ?? '';
            if (!sha.startsWith(EXPECTED_SHA)) problems.push(`Unexpected build running: ${sha.slice(0, 7)} (expected ${EXPECTED_SHA})`);
            const q = h.demo_quota ?? {};
            for (const k of ['ask', 'image', 'voice']) {
              const used = q.used?.[k] ?? 0, limit = q.limits?.[k] ?? 0;
              lines.push(`${k}: ${used} / ${limit}`);
              if (limit > 0 && used >= limit) problems.push(`Demo ${k} limit reached today (${used}/${limit})`);
              else if (limit > 0 && used / limit >= Number(QUOTA_WARN)) problems.push(`Demo ${k} at ${Math.round((100 * used) / limit)}% of today's limit (${used}/${limit})`);
            }
            lines.push(`visitors today: ${q.visitors ?? 0}`);
            if ((q.visitors ?? 0) >= Number(VISITORS_WARN)) problems.push(`Unusually many demo visitors today: ${q.visitors}`);
            lines.push(`build: ${(h.build?.sha ?? '').slice(0, 7)}, response: ${ms} ms`);
          }
          const fs = await import('node:fs');
          const summary = [`### Lumina live check (${new Date().toISOString()})`, '', ...lines.map((l) => `- ${l}`), '',
            problems.length ? '**Problems:**' : 'All normal.', ...problems.map((p) => `- ${p}`)].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          console.log(summary);
          const q = h?.demo_quota ?? {};
          const head = problems.length ? `PROBLEM: ${problems[0]}` : `OK: ${q.used?.ask ?? '?'}/${q.limits?.ask ?? '?'} questions, ${q.visitors ?? '?'} visitors today`;
          const sydney = new Date().toLocaleString('en-AU', { timeZone: 'Australia/Sydney', hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
          fs.writeFileSync('status.md', summary + '\n\nRun: ' + process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `subject=Lumina ${sydney}: ${head}\n`);
          if (problems.length) {
            console.log('\nWhat to do: open the web app in the Azure portal. Restart resets the demo counts; raise DEMO_DAILY_* to allow more.');
            process.exit(1);
          }
          JS

      - name: Email status
        if: always() && env.HAS_MAIL == 'yes'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || '465' }}
          secure: ${{ (secrets.MAIL_PORT || '465') == '465' }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "Lumina monitor <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ secrets.MAIL_TO }}
          subject: "${{ steps.check.outputs.subject || 'Lumina monitor - check did not finish' }}"
          body: file://status.md
          convert_markdown: true
